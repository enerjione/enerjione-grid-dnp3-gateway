[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enerjione-dnp3-gateway"
version = "1.7.3"
description = "EnerjiOne Grid platformu icin standalone DNP3 master gateway servisi (saha DNP3 outstation -> NATS JetStream)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - Form Elektrik" }
authors = [{ name = "Form Elektrik", email = "info@formelektrik.com" }]
dependencies = [
    "nats-py>=2.6,<3",
    "pydantic>=2.5,<3.0",
    "pydantic-settings>=2.1,<3.0",
    "requests>=2.31,<3.0",
]

[project.optional-dependencies]
# Saf-Python DNP3 master (legacy / fallback). Default deployment yadnp3
# (OpenDNP3 native) wheel'ini kullanir — bu sadece yadnp3 derlemesi
# yapilamayan platformlar icin alternatif. yadnp3 PyPI'de wheel oldugu
# icin requirements.txt'te direct kuruluyor (ekstrasyz).
dnp3 = ["nfm-dnp3>=1.0.1,<2.0"]
dev = [
    "pytest>=7.4,<9.0",
    "pytest-cov>=4.1,<6.0",
    "ruff>=0.5,<1.0",
]

[project.scripts]
enerjione-dnp3-gateway = "dnp3_gateway.main:main"

[tool.setuptools.packages.find]
where = ["src"]

# Yerlesik cihaz profilleri (DNP3 adres haritalari) PAKETE DAHIL.
# Docker imaji `pip install -e` kullandigi icin dosyalar zaten diskte duruyor
# ve bu satir olmadan da calisir; ama biri wheel/sdist uretirse JSON'lar
# disarida kalir ve `builtin_profile()` SESSIZCE bos doner — bilinen modeller
# yerlesik haritasiz kalir. Paketleme yolunu simdiden kapatiyoruz.
[tool.setuptools.package-data]
"dnp3_gateway.profiles" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# opendnp3 (yadnp3) C++ binding'i PascalCase metod adlari kullanir
# (ISOEHandler.Process, IMasterApplication.OnOpen, master.DirectOperate ...).
# Bunlari override/mock ederken Python adlandirma kuralina uyamayiz.
"src/dnp3_gateway/adapters/dnp3_yadnp3_master.py" = ["N802", "N803"]
"tests/test_crob_command.py" = ["N802", "N803"]
# TelemetryReader.close() bilincli olarak bos bir varsayilan (no-op):
# state tutmayan adapter'lar (mock) override etmek zorunda kalmasin.
"src/dnp3_gateway/adapters/base.py" = ["B027"]
