# EnerjiOne DNP3 Gateway — per-instance docker compose
#
# Bu dosya backend'in (veya scripts/render_compose.py'nin) frontend "Yeni
# gateway ekle" akisi sirasinda renderladigi sablondur. Yer tutucular:
#   {{GATEWAY_CODE}}    — backend'de tanimli kod (orn. GW-001)
#   {{GATEWAY_TOKEN}}   — backend'in urettigi rastgele token (>=32 char)
#   {{GATEWAY_NAME}}    — insan-okur isim
#   {{BACKEND_API_URL}} — backend public URL (orn. https://api.enerjione.local/api/v1)
#   {{NATS_URL}}        — JetStream URL (orn. nats://enerjione-nats:4222)
#   {{HOST_HEALTH_PORT}}— host tarafinda exposed port (her instance icin farkli)
#   {{IMAGE}}           — docker image tag (orn. ghcr.io/enerjione/enerjione-grid-dnp3-gateway:1.13.0)
#   {{APP_ENVIRONMENT}} — production | staging | development
#   {{INSTALL_MODE}}    — local | remote. NATS ERISILEMEDIGINDE ne olacagini
#                         BELIRLER: `local` (gateway backend ile ayni makinede)
#                         NATS'i zorunlu tutar, HTTP yedegi YOKTUR — ayni makinede
#                         NATS'a erisememek yapilandirma hatasidir ve sessizce
#                         HTTP'ye dusmek onu gizler. `remote` (uzak saha kurulumu)
#                         NATS birincil + HTTP yedegidir.
#
# Uretilen dosya tek basina calisir: `docker compose -f gw-001.yml up -d`.
# Ayni host'ta N tane gateway icin N tane farkli dosya / project name kullanilir.
#
# Gateway 0.4.x'te telemetri akisi NATS JetStream'dir. Backend tarafindaki
# alarm/notification akisi RabbitMQ'da kalir — gateway onunla ilgilenmez.

name: enerjione-gateway-{{GATEWAY_CODE_LOWER}}

services:
  gateway:
    image: {{IMAGE}}
    container_name: eg-gw-{{GATEWAY_CODE_LOWER}}
    restart: unless-stopped
    # DOSYA TANITICI (fd) TAVANI — cihaz sayisinin GERCEK sinirlayicisi.
    #
    # Her DNP3 cihazi bir TCP soketi tutar; 400 cihazli olcumde 420 fd acikti
    # (2026-08-04). Docker'in varsayilan soft limiti 1024 -> yaklasik 950-1000
    # cihazda mutlak duvar, ama PRATIK sinir cok daha erken: baglanti flap'inde
    # eski soket kapanmadan yenisi acilir ve fd gecici olarak ikiye katlanabilir.
    #
    # Limit dolunca hata "cihaz kopuk" gibi gorunur (soket acilamaz) ve gercek
    # sebep hicbir sayacta yazmaz — teshisi en zor ariza tiplerinden biri.
    # 65536 ile 500 cihaz hedefinde bol pay kalir.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Graceful shutdown penceresi. `docker stop` varsayilani 10sn'dir ve
    # gateway'in tipik kapanisi (<8sn) buna ANCAK sigar — pay yok.
    # Pencere yetmezse proses SIGKILL ile oldurulur ve in-flight bir CROB'un
    # sonucu komut defterine yazilamaz; o komut sonraki acilista backend'e
    # 'unknown' bildirilir (veri kaybi degil ama operator icin gereksiz
    # belirsizlik). 30sn bol pay birakir, saglikli kapanista beklenmez.
    stop_grace_period: 30s
    environment:
      GATEWAY_CODE: "{{GATEWAY_CODE}}"
      GATEWAY_TOKEN: "{{GATEWAY_TOKEN}}"
      GATEWAY_NAME: "{{GATEWAY_NAME}}"
      APP_ENVIRONMENT: "{{APP_ENVIRONMENT}}"
      GATEWAY_MODE: "dnp3"
      BACKEND_API_URL: "{{BACKEND_API_URL}}"
      BACKEND_API_VERIFY_SSL: "true"
      # KURULUM TIPI — sozlesmede `required_environment` icinde, ama bu
      # sablondan EKSIKTI. Eksikligi sessizdi: config.py varsayilani
      # `remote` oldugu icin YEREL bir kurulum "NATS erisilemezse HTTP'ye
      # dus" davranisini sessizce kazaniyordu. `local` kurulumda bu YANLIS:
      # ayni makinede NATS'a erisememek bir yapilandirma hatasidir ve
      # HTTP yedegi o hatayi gizleyerek 500-cihaz hedefini bozar.
      #
      # Deger render zamani gelir; burada VARSAYILAN YOK — bilincli secim.
      INSTALL_MODE: "{{INSTALL_MODE}}"
      # TELEMETRI YOLU: STANDART `nats` — telemetri dogrudan JetStream'e
      # basilir (subject: e1.telemetry.raw.<code>), backend'e HIC ugramaz.
      # HTTP ingest yalnizca bilincli rollback icindir (`http`): o yolda her
      # olcum backend HTTP + Postgres outbox zincirinden gecer ve yuk
      # backend'e biner (2026-08-04 yuk testinde olculdu). Komut/config
      # kanali bundan bagimsiz, HTTP uzerinden calisir.
      TELEMETRY_PUBLISHER: "nats"
      NATS_URL: "{{NATS_URL}}"
      NATS_SUBJECT_PREFIX: "e1.telemetry.raw"
      # WORKER_HEALTH_HOST=0.0.0.0: Container icinde butun interface'lere bind.
      # Disariya yalnizca 127.0.0.1:HOST_HEALTH_PORT ile aciliyor (asagidaki
      # ports section). /info ve /metrics endpoint'leri Bearer auth ister
      # (refresh_token), boylece ayni Docker network'undeki diger container'lar
      # da auth-suz okuyamaz.
      WORKER_HEALTH_HOST: "0.0.0.0"
      WORKER_HEALTH_PORT: "8020"
      # Polling: sablon eskiden 5sn/50-paralel ile config.py'nin 300-cihaz
      # icin tune edilmis varsayilanlarini (1sn/100) GERI ALIYORDU. 300
      # cihazda 6 dalga demekti ve frontend'de olcum yasi 5-30sn araliginda
      # saliniyordu. Artik kod varsayilanlariyla ayni.
      # Cihaz eklendiginde ANLIK tetik `config_nonce` ile gelir (komut-poll
      # 1sn'de bir okur). Bu periyodik refresh onun YEDEGI: tetik herhangi bir
      # sebeple calismazsa yeni cihaz en gec bu surede gorulur. Sahada tetik
      # olunce varsayilan 300sn yuzunden 5 DAKIKA beklenmisti.
      # Maliyet ~sifir: config istekleri ETag ile sartli (degismediyse 304).
      CONFIG_REFRESH_SEC: "30"
      DEFAULT_POLL_INTERVAL_SEC: "1"
      MAX_PARALLEL_DEVICES: "500"
      # Aktif adapter. Kod varsayilani da bu; explicit tutuluyor ki
      # varsayilan degisirse uretim davranisi sessizce kaymasin.
      DNP3_LIBRARY: "yadnp3"
      DNP3_LOCAL_ADDRESS: "1"
      DNP3_TCP_PORT: "20000"
      DNP3_EVENT_BASELINE_INTERVAL_SEC: "30"
      # EXPLICIT OLMAK ZORUNDA: verilmezse kod varsayilani 0 ve factory
      # scan'i POLL'a dusurur (poll=1 -> scan=1s). 401 cihazli sahada
      # olculdu: saniyede 401 DNP3 istegi, CPU cihaz sayisiyla orantili.
      DNP3_EVENT_SCAN_INTERVAL_SEC: "5"
      # opendnp3 IO thread sayisi: 0 = otomatik (min 4). 300 cihazda 8-12.
      DNP3_MANAGER_THREADS: "0"
      # Outstation saat senkronizasyonu (RTC drift + guc kesintisi sonrasi reset).
      DNP3_TIME_SYNC: "lan"
      # NOT: DNP3_RESPONSE_TIMEOUT_SEC / DNP3_READ_STRATEGY kaldirildi —
      # bunlar YALNIZCA legacy DNP3_LIBRARY=dnp3py dalinda gecerli; varsayilan
      # yadnp3 adapter'i onlari yok sayiyor ve set edilmeleri operatoru
      # "ayari degistirdim ama bir sey olmadi" cikmazina sokuyordu.
      LOG_LEVEL: "INFO"
      LOG_FORMAT: "json"
      SHOW_GATEWAY_TOKEN_ON_START: "false"
    ports:
      # Sadece host'a aciliyor; container ici sabit 8020.
      - "127.0.0.1:{{HOST_HEALTH_PORT}}:8020"
      # --- INITIATING DINLEYICI PORTLARI -----------------------------------
      # `ip_endpoint_type=initiating` cihazlarda baglantiyi CIHAZ baslatir
      # (4G/SIM arkasindaki Horstmann). Gateway container ICINDE cihazin
      # `master_ip_port` degerini dinler; bridge ag modunda o port host'a
      # acilmazsa cihaz HICBIR ZAMAN baglanamaz.
      #
      # Esleme KIMLIKTIR (host == container): cihaz `master_ip_port`a
      # baglanir ve gateway ayni portu dinler.
      #
      # Blok gateway BASINA ayrilir; ayni host'ta N gateway varsa bloklar
      # AYRIK olmak zorundadir (iki container ayni host portunu bind edemez).
      # Ayirma sorumlulugu deployment/orkestrasyon tarafindadir —
      # bkz. docs/BACKEND_TODO.md#B6.
      #
      # Health portunun aksine bu portlar 127.0.0.1'e DEGIL saha agina
      # bakan arayuze acilir; erisimi APN/guvenlik duvari ile sinirlayin.
      #
      # Asagidaki satir render sirasinda ya gercek eslemelerle DEGISTIRILIR
      # ya da (blok ayrilmadiysa) TAMAMEN SILINIR. Sablonun kendisi gecerli
      # YAML kalsin diye bir liste ogesi olarak duruyor.
      - "{{INITIATING_PORT_MAPPINGS}}"
    volumes:
      # Persistent state: instance_id + outbox SQLite. Volume kaybolursa
      # at-most-once garanti yerine duplicate mesaj gelebilir (tag-engine
      # idempotent oldugu icin sorun cikarmaz; yine de korumak isteriz).
      - state:/app/.gateway_state
    networks:
      - enerjione
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8020/health',timeout=3).status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  state:
    name: eg-gw-{{GATEWAY_CODE_LOWER}}-state

networks:
  enerjione:
    # External=true yaparsaniz host'taki ortak `enerjione` ag'ina bagi olur
    # (backend + NATS ayni network'te). Aksi halde her gateway ayri network
    # olusturur — sorun cikmaz, sadece tek bir backend/NATS'a cikis yolu host
    # network uzerinden olur.
    name: enerjione
    external: false
