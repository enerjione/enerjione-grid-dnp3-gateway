# Build & push container image to GitHub Container Registry (ghcr.io).
#
# ETIKETLEME POLITIKASI (2026-07 degisikligi)
# -------------------------------------------
# ESKI: main'e giden her push `:latest`'i EZIYORDU ve test kapisi yoktu.
#   Sahadaki compose dosyalari `:latest` cektigi icin, bir sunucu bakiminda
#   `docker compose pull && up -d` yapan operator test edilmemis bir imaji
#   uretime aliyordu. Bozuk bir commit tum sahayi ayni anda dusurebiliyordu
#   ve geri donus icin saglam bir etiket de yoktu.
#
# YENI:
#   * main push   -> SADECE :main + :sha-<short>   (deneme/CI imaji)
#   * tag v*.*.*  -> :<version> + :<major>.<minor> + :latest  (uretim surumu)
#   `:latest` artik yalnizca bilincli bir surum etiketiyle olusur; rollback
#   icin her surumun kendi semver etiketi vardir.
#
# Ayrica: `needs: ci` — testler ve lint gecmeden HICBIR imaj yayinlanmaz.
#
# Image visibility:
#   Repo private olsa da paket GitHub UI'dan PUBLIC yapilabilir
#   (Packages -> enerjione-dnp3-gateway -> Settings -> Change visibility).
#   Sonrasinda son kullanici `docker login` olmadan pull edebilir.
#
# Multi-arch:
#   yadnp3 (OpenDNP3 native) PyPI'de arm64 wheel saglamiyor; bu yuzden
#   linux/amd64 only. Saha sunuculari zaten amd64.

name: release-image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # KAPI: testler + lint gecmeden imaj yayinlanmaz.
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # main push -> :main + :sha-<short>
          # tag v0.5.0 -> :0.5.0 + :0.5 + :latest
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            DNP3_LIBRARY=yadnp3
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ozet
        run: |
          echo "### Yayinlanan etiketler" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
