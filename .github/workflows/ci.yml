# CI kapisi — her push ve PR'da calisir.
#
# NEDEN: Bu repoda daha once TEK bir workflow vardi (release-image.yml) ve o da
# yalnizca imaj build/push yapiyordu. `pytest` / `ruff` adimi YOKTU ve tetikleyici
# `push: branches:[main]` idi — yani main'e giden her commit TEST EDILMEDEN
# ghcr.io/:latest olarak yayinlaniyor, sahadaki compose dosyalari da `:latest`
# cekiyordu. Import hatasi seviyesindeki bir bug (orn. modulde eksik `import
# logging`) bu boru hattindan hicbir engele takilmadan sahaya iniyordu.
#
# Bu workflow o kapiyi kurar; release-image.yml artik `needs: ci` ile buna baglidir.

name: ci

# NOT: `push` tetikleyicisi BILINCLI OLARAK YOK.
# main/tag push'unda release-image.yml calisir ve bu workflow'u `needs: ci` ile
# ZATEN cagirir. Buraya push eklenirse ayni commit icin testler iki kez kosar ve
# (ayni concurrency grubuna dustuklerinde) birbirlerini iptal ederler — ilk
# kurulumda tam olarak bu oldu, `ci` run'i "cancelled" duruma dustu.
on:
  pull_request:
    branches: [main]
  workflow_call: {}   # release-image.yml bunu tekrar kullanir
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # `github.workflow` cagiran workflow'un adina cozulur (dogrudan tetikte "ci",
  # release-image icinden cagrildiginda "release-image"). Grup adina dahil
  # edilmezse iki calisma ayni gruba duser ve birbirini iptal eder.
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "ruff>=0.5,<1.0"
      - name: ruff check
        run: ruff check .
      # Artik GERCEK kapi. `continue-on-error: true` ile birlikte bu adim
      # 30 dosyada surekli basarisiz oluyor ama CI'i yesil gosteriyordu; boyle
      # bir adim uyari da vermez, yalnizca gurultu olur ve zamanla borc buyur.
      # Borc odendi (30 dosya bicimlendirildi, 225 test etkilenmedi).
      - name: ruff format --check
        run: ruff format --check .

  test:
    # ISIMDE OS DA OLMALI: matriste iki ayri 3.12 isi var (ubuntu + windows) ve
    # ikisi de "pytest (py3.12)" adiyla goruntuleniyordu. Windows'un matriste
    # olma sebebi zaten YALNIZCA Windows'ta ciken bir hataydi (byte-range
    # kilidi); o job kirmizi yandiginda hangi platform oldugunu ad'dan
    # okuyamamak, tam da onu yakalamak icin kurulan kapiyi korlestirirdi.
    name: pytest (${{ matrix.os }} py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Uretim hedefi Windows Server + Linux Docker; ikisini de kosuyoruz.
        # Windows'ta kosmak sart: multi-instance lock hatasi (byte-range
        # kilidi) YALNIZCA Windows'ta ortaya cikiyordu ve Linux-only bir CI
        # onu asla yakalayamazdi.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
        exclude:
          # Matrisi kisa tut: Windows'ta tek surum yeterli (platform-ozel
          # kod yollari surum bagimsiz).
          - os: windows-latest
            python-version: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install deps
        run: pip install -r requirements-dev.txt
      # DNP3 native binding. Bu ADIM OLMADAN deponun EN KRITIK modulu
      # (dnp3_yadnp3_master — tum olcumler ve tum kesici komutlari oradan
      # geciyor) hic calistirilmadan CI yesil doner: `test_dnp3_loopback.py`
      # opendnp3 yoksa kendini atlar. Ayri dosyadan kuruluyor cunku ana
      # bagimlilik listesine konsa macOS/arm64 gelistiricisinde kurulum
      # tamamen patlardi (o platformlar icin wheel yok).
      - name: Install DNP3 native (yadnp3)
        run: pip install -r requirements-dnp3.txt
      # Sessiz atlamaya karsi acik kapi: wheel kurulmadiysa is BURADA dussun,
      # loopback testleri sessizce atlanip "yesil" gorunmesin.
      - name: yadnp3 gercekten kurulu mu
        run: python -c "import opendnp3; print('opendnp3 hazir')"
      - name: pytest
        run: pytest -q --cov=dnp3_gateway --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Upload coverage (ubuntu/3.12 only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  docker:
    # DAGITIM YOLU BURASI. Saha Docker ile kuruluyor; yani Dockerfile bir
    # yardimci dosya degil, URUNUN KENDISI.
    #
    # Bu is EKSIKTI: imaj yalnizca main'e push'ta (release-image.yml) build
    # ediliyordu. Dockerfile'i bozan bir PR sorunsuz merge oluyor, hata ancak
    # main'e indikten SONRA goruluyordu — yani kapinin yanlis tarafinda.
    #
    # `push: false` — burada yalnizca DOGRULAMA yapariz; yayinlama hala
    # release-image.yml'in isi. Cache release-image ile paylasildigi icin ek
    # maliyet dusuk.
    name: docker imaji
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Imaji build et (yayinlamadan)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            DNP3_LIBRARY=yadnp3
          platforms: linux/amd64
          push: false
          load: true          # sonraki adimlar imaji CALISTIRACAK
          tags: dnp3-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # "Build oldu" YETMEZ: imaj derlenip icindeki uygulama yine de
      # acilmayabilir (eksik native kutuphane, yanlis PYTHONPATH, kirik
      # entrypoint). Docker-only bir dagitimda bunu yakalayacak baska kapi YOK.
      #
      # NOT: `--entrypoint python` ile entrypoint ATLANIYOR — o script
      # GATEWAY_CODE/GATEWAY_TOKEN zorunlu kilar ve burada amac imajin
      # ICERIGINI dogrulamak. Entrypoint'in kendisi ayri bir adimda test edilir.
      # URETIM IMAJI LOCK'TAKI SURUMLERI TASIYOR MU
      #
      # Dockerfile'i sessizce `requirements.txt` (araliklar) haline geri
      # dondurmek imaji yeniden tekrar-uretilemez yapardi ve bu HICBIR
      # yerde gorunmezdi. Bu adim imajin ICINDEKI surumleri lock ile
      # karsilastirir; ilk uyusmazlikta duser.
      - name: Imaj kilitli bagimliliklari mi tasiyor
        run: |
          docker run --rm --entrypoint python dnp3-gateway:ci -m pip freeze \
            | sed -E 's/ @ .*#sha256=.*//' > /tmp/imaj-freeze.txt
          python - <<'PY'
          import re, pathlib, sys
          lock = pathlib.Path("requirements-lock-linux-py311.txt").read_text(encoding="utf-8")
          beklenen = dict(re.findall(r"^([A-Za-z0-9_.\-]+)==([^ \\\n]+)", lock, re.M))
          # `pip freeze` wheel'den kurulmus paketleri `ad @ file://...` seklinde
          # yazar; yukaridaki sed onu `ad` haline getirir, surum ise METADATA'dan
          # gelir. Bu yuzden surumu importlib ile teyit ediyoruz.
          import subprocess, json
          kod = ("import json,importlib.metadata as m;"
                 "print(json.dumps({k: m.version(k) for k in " + repr(sorted(beklenen)) + "}))")
          ciktı = subprocess.run(
              ["docker", "run", "--rm", "--entrypoint", "python", "dnp3-gateway:ci", "-c", kod],
              capture_output=True, text=True, check=True).stdout
          gercek = json.loads(ciktı)
          hata = [f"{k}: lock={v} imaj={gercek.get(k)}" for k, v in beklenen.items() if gercek.get(k) != v]
          if hata:
              print("IMAJ LOCK ILE UYUSMUYOR:", *hata, sep="\n  ")
              sys.exit(1)
          print(f"imaj {len(beklenen)} kilitli paketin hepsini tam surumuyle tasiyor")
          PY
      - name: Imajin icinde DNP3 native yuklu mu
        run: |
          docker run --rm --entrypoint python dnp3-gateway:ci \
            -c "import opendnp3; print('opendnp3 imaj icinde hazir')"
      - name: Uygulama imajin icinde acilabiliyor mu
        run: |
          docker run --rm --entrypoint python dnp3-gateway:ci -m dnp3_gateway --version
      - name: Surum imajda da tutarli mi
        run: |
          set -euo pipefail
          BEKLENEN="$(tr -d '[:space:]' < VERSION)"
          GERCEK="$(docker run --rm --entrypoint python dnp3-gateway:ci \
            -c 'import dnp3_gateway; print(dnp3_gateway.__version__)' | tr -d '[:space:]')"
          echo "VERSION=$BEKLENEN imaj=$GERCEK"
          if [ "$BEKLENEN" != "$GERCEK" ]; then
            echo "::error::Imajdaki surum ($GERCEK) VERSION dosyasindan ($BEKLENEN) farkli."
            exit 1
          fi
      # Entrypoint sozlesmesi: kimlik verilmeden container BASLAMAMALI.
      # Baslasaydi, yanlis yapilandirilmis bir gateway sessizce ayaga kalkip
      # backend'e kimliksiz istek yagdirirdi. Beklenen cikis kodu 64.
      - name: Entrypoint kimlik dogrulamasi calisiyor mu
        run: |
          set +e
          cikti="$(docker run --rm dnp3-gateway:ci 2>&1)"
          kod=$?
          set -e
          echo "$cikti"
          if [ "$kod" -ne 64 ]; then
            echo "::error::GATEWAY_CODE/TOKEN yokken container cikis kodu 64 olmali, $kod dondu."
            exit 1
          fi

  build-sanity:
    name: paket derlenebiliyor mu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - name: build wheel + sdist
        run: python -m build
      - name: surum tutarliligi (VERSION == pyproject == calisma-zamani)
        run: |
          set -euo pipefail
          VERSION_FILE="$(tr -d '[:space:]' < VERSION)"
          PYPROJECT="$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          RUNTIME="$(PYTHONPATH=src python -c "import dnp3_gateway; print(dnp3_gateway.__version__)")"
          echo "VERSION=$VERSION_FILE pyproject=$PYPROJECT runtime=$RUNTIME"
          if [ "$VERSION_FILE" != "$PYPROJECT" ] || [ "$VERSION_FILE" != "$RUNTIME" ]; then
            echo "::error::Surum uyusmazligi — VERSION, pyproject.toml ve dnp3_gateway.__version__ ayni olmali."
            exit 1
          fi
