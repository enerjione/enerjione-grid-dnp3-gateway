# CI kapisi — her push ve PR'da calisir.
#
# NEDEN: Bu repoda daha once TEK bir workflow vardi (release-image.yml) ve o da
# yalnizca imaj build/push yapiyordu. `pytest` / `ruff` adimi YOKTU ve tetikleyici
# `push: branches:[main]` idi — yani main'e giden her commit TEST EDILMEDEN
# ghcr.io/:latest olarak yayinlaniyor, sahadaki compose dosyalari da `:latest`
# cekiyordu. Import hatasi seviyesindeki bir bug (orn. modulde eksik `import
# logging`) bu boru hattindan hicbir engele takilmadan sahaya iniyordu.
#
# Bu workflow o kapiyi kurar; release-image.yml artik `needs: ci` ile buna baglidir.

name: ci

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_call: {}   # release-image.yml bunu tekrar kullanir
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "ruff>=0.5,<1.0"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
        continue-on-error: true   # formatlama henuz zorunlu degil; once uyari

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Uretim hedefi Windows Server + Linux Docker; ikisini de kosuyoruz.
        # Windows'ta kosmak sart: multi-instance lock hatasi (byte-range
        # kilidi) YALNIZCA Windows'ta ortaya cikiyordu ve Linux-only bir CI
        # onu asla yakalayamazdi.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
        exclude:
          # Matrisi kisa tut: Windows'ta tek surum yeterli (platform-ozel
          # kod yollari surum bagimsiz).
          - os: windows-latest
            python-version: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: pytest
        run: pytest -q --cov=dnp3_gateway --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Upload coverage (ubuntu/3.12 only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  build-sanity:
    name: paket derlenebiliyor mu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - name: build wheel + sdist
        run: python -m build
      - name: surum tutarliligi (VERSION == pyproject == calisma-zamani)
        run: |
          set -euo pipefail
          VERSION_FILE="$(tr -d '[:space:]' < VERSION)"
          PYPROJECT="$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          RUNTIME="$(PYTHONPATH=src python -c "import dnp3_gateway; print(dnp3_gateway.__version__)")"
          echo "VERSION=$VERSION_FILE pyproject=$PYPROJECT runtime=$RUNTIME"
          if [ "$VERSION_FILE" != "$PYPROJECT" ] || [ "$VERSION_FILE" != "$RUNTIME" ]; then
            echo "::error::Surum uyusmazligi — VERSION, pyproject.toml ve dnp3_gateway.__version__ ayni olmali."
            exit 1
          fi
